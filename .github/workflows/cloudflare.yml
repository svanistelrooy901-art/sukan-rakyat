name: Deploy Cloudflare trial backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sukan-rakyat-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node worker/configure.mjs
      - run: npx --no-install wrangler d1 migrations apply sukan-rakyat --remote --config worker/deploy.json
      - run: npx --no-install wrangler deploy --config worker/deploy.json
